name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # check, a clean production build, the VSIX file-list check, then vsce package (the project's own recipe).
      - run: npm run package -- -o tn5250-terminal.vsix
      - uses: actions/upload-artifact@v5
        with:
          name: tn5250-terminal.vsix
          path: tn5250-terminal.vsix
