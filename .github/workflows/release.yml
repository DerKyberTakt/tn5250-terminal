name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # Open VSX trusted publishing exchanges a GitHub OIDC token for a short-lived publish token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.VSCE_PAT != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node esbuild.mjs --production
      - run: npx @vscode/vsce package --no-dependencies -o tn5250-terminal.vsix
      - uses: softprops/action-gh-release@v3
        with:
          files: tn5250-terminal.vsix
      - name: Publish to the Marketplace (skipped when VSCE_PAT is not set)
        if: ${{ env.HAS_PAT == 'true' }}
        run: npx @vscode/vsce publish --no-dependencies --packagePath tn5250-terminal.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX (trusted publisher, no token; a failure here never blocks the release)
        continue-on-error: true
        run: npx ovsx@1 publish tn5250-terminal.vsix --trusted-publishing --skip-duplicate
